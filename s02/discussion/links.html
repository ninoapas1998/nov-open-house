<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>HTML Hyperlinks</title>
	</head>
	<body>
		<h1>HTML Hyperlinks</h1>
		<p>Hyperlinks are created with anchor tags.</p>
		<h3>There are 2 kinds of links:</h3>
		<!-- creates an unordered lists with bullet points -->
		<ul>
			<li>Absolute</li>
			<li>Relative</li>
		</ul>

		<div>
			<!-- Absolute links are links to page redirected to other websites/outside of the current domain -->
			<h4>Absolute Links</h4>
			<!-- target attribute is used to determine if a new tab page will be used -->
			<!-- a/anchor tags creates hyperlink. hyperlinks can be clicked -->
			<a href="https://zuitt.co" target="_blank">Zuitt Tech Career Program</a>
			<a href="https://linkedin.com">LinkedIn</a>
		</div>

		<div>
			<h4>Relative Links</h4>
			<!-- ./ is used to link another html page within the same folder -->
			<a href="./attributes.html">Attribute Page</a>
			<a href="./links.html">Links Page</a>
			<a href="./index.html">Index Page</a>
		</div>

	</body>
</html>
